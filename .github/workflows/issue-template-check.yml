name: Issue 템플릿 검증

on:
  issues:
    types:
      - opened
      - edited

jobs:
  validate-template:
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest
    steps:
      - name: Issue 본문 검증
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.issue.body || '').trim();
            const requiredSections = [
              '### 문제 설명',
              '### 재현 절차',
              '### 기대 동작'
            ];
            const missing = requiredSections.filter(section => !body.includes(section));
            if (missing.length === 0) {
              core.info('Issue 템플릿이 정상적으로 사용되었습니다.');
              return;
            }
            const warning = [
              '안녕하세요! 작성하신 이슈에서 다음 템플릿 섹션이 확인되지 않습니다:',
              '',
              missing.map(name => `- ${name}`).join('\n'),
              '',
              '템플릿의 각 항목을 모두 채워 주셔야 원활한 triage가 가능합니다. 내용을 보완해 주세요.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: warning
            });
            const labelName = 'needs-template-update';
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: [labelName]
              });
            } catch (error) {
              core.info(`라벨 ${labelName}이 없어 생성을 시도합니다.`);
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: 'fbca04',
                  description: '이슈 템플릿 미준수 시 자동으로 부여되는 라벨'
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  labels: [labelName]
                });
              } else {
                throw error;
              }
            }
            core.setFailed('필수 템플릿 섹션 누락');

