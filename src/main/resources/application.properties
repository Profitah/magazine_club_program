spring.application.name=Sensitibook
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
server.port=${SERVER_PORT}
mybatis.mapper-locations=classpath:/mappers/*.xml
mybatis.type-aliases-package=com.club.magazine_club_program.DTO

# Instagram Configuration
instagram.target.username=${INSTAGRAM_TARGET_USERNAME}
instagram.source.username=${INSTAGRAM_SOURCE_USERNAME}

python.service.url=${PYTHON_SERVICE_URL}
chat.server.base-url=${CHAT_SERVER_BASE_URL}

# Kakao OAuth2 Configuration
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
# Redirect URI 설정
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8080/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
# account_email은 카카오 개발자 콘솔에서 동의 항목 활성화 후 사용 가능
# spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# 세션 설정
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
server.servlet.session.cookie.max-age=1800
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.persistent=false

# HTTPS 필수 설정 (프로덕션)
# 개발 환경에서는 false로 설정 가능, 프로덕션에서는 반드시 true
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=tomcat

# 리버스 프록시 지원 (세션 유지)
server.use-forward-headers=true

# OAuth2 토큰 암호화 키 설정 (필수)
# 32바이트(256비트) 키를 Base64 인코딩하여 설정
# 키 생성: TokenEncryptionUtil.generateKey() 또는
# KeyGenerator keyGenerator = KeyGenerator.getInstance("AES");
# keyGenerator.init(256);
# SecretKey key = keyGenerator.generateKey();
# String base64Key = Base64.getEncoder().encodeToString(key.getEncoded());
# TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}

# OAuth2 디버깅 로그 (401 오류 확인용)
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.club.magazine_club_program=DEBUG
